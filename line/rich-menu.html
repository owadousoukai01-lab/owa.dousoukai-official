<!DOCTYPE html>
<!--
  LINE リッチメニュー画像の元データ（2500×1686px・6分割）
  文字やアイコンを変えたら、README の手順で PNG に書き出してください。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
    :root { --navy: #0d2142; --sakura: #ff5a87; --peach: #fdeee8; --cream: #fbf8f5; }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 2500px; height: 1686px; overflow: hidden; }
    body {
        font-family: "Zen Kaku Gothic New", sans-serif;
        background:
            radial-gradient(900px 700px at 100% 0%, rgba(255, 90, 135, .22), transparent 70%),
            radial-gradient(900px 700px at 0% 100%, rgba(46, 111, 181, .14), transparent 70%),
            var(--cream);
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        gap: 28px; padding: 28px;
    }
    .tile {
        position: relative; overflow: hidden;
        background: #fff; border-radius: 56px;
        box-shadow: 0 4px 0 rgba(13, 33, 66, .06), 0 20px 50px rgba(13, 33, 66, .08);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
        color: var(--navy);
    }
    .tile.dark { background: var(--navy); color: #fff; }
    .tile.dark::before {
        content: ""; position: absolute; width: 640px; height: 640px; right: -260px; top: -260px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 90, 135, .45), transparent 70%);
    }
    .icon {
        position: relative; width: 240px; height: 240px; border-radius: 50%;
        display: grid; place-items: center; background: var(--peach);
    }
    .dark .icon { background: rgba(255, 255, 255, .1); }
    .icon svg { width: 130px; height: 130px; stroke: var(--sakura); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .label { position: relative; font-weight: 900; font-size: 92px; line-height: 1.25; text-align: center; letter-spacing: .02em; }
    .sub { position: relative; font-family: "Outfit", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: .2em; color: var(--sakura); margin-top: -28px; }
    .mascot { position: absolute; right: 36px; bottom: 28px; width: 190px; transform: rotate(8deg); }
</style>
</head>
<body>
    <!-- A: お知らせ -->
    <div class="tile">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></div>
        <p class="label">お知らせ</p>
        <p class="sub">NEWS</p>
    </div>
    <!-- B: 支援する -->
    <div class="tile dark">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.1 2.1 0 0 0-2.9-.1z"/><path d="M12 15l-3-3a22 22 0 0 1 2-4A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0"/><path d="M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5"/></svg></div>
        <p class="label">桜和生を<br>支援する</p>
    </div>
    <!-- C: お問い合わせ -->
    <div class="tile">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></div>
        <p class="label">お問い合わせ</p>
        <p class="sub">CONTACT</p>
    </div>
    <!-- D: ホームページ -->
    <div class="tile">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></div>
        <p class="label">ホームページ</p>
        <p class="sub">WEBSITE</p>
        <img src="../images/さくた.webp" alt="" class="mascot">
    </div>
    <!-- E: 役員に立候補 -->
    <div class="tile">
        <div class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M19 8v6M16 11h6"/></svg></div>
        <p class="label">役員に<br>立候補する</p>
    </div>
    <!-- F: Instagram -->
    <div class="tile">
        <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#ff5a87"/></svg></div>
        <p class="label">Instagram</p>
        <p class="sub">@owa.dousoukai25</p>
    </div>
</body>
</html>
