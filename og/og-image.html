<!DOCTYPE html>
<!--
  SNS・LINEでシェアされたときのサムネイル画像の元データ（1200×630px）
  書き出し先：images/og-image.png（手順は line/README.md の Edge コマンドと同じ。サイズだけ 1200,630 に変更）
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        font-family: "Zen Kaku Gothic New", sans-serif; color: #fff;
        background: #0d2142; display: grid; grid-template-columns: 1fr 520px;
        position: relative;
    }
    body::before {
        content: ""; position: absolute; width: 700px; height: 700px; left: 260px; top: -380px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 90, 135, .4), transparent 70%);
    }
    .copy { position: relative; padding: 72px 0 64px 72px; display: flex; flex-direction: column; }
    .badge { align-self: flex-start; background: #fff; color: #0d2142; font-weight: 900; font-size: 22px; padding: 6px 18px; border-radius: 10px; }
    h1 { margin-top: 40px; font-weight: 900; font-size: 64px; line-height: 1.3; letter-spacing: -.01em; }
    h1 span { color: #ff5a87; }
    .foot { margin-top: auto; font-size: 24px; color: rgba(255, 255, 255, .75); }
    .foot b { display: block; font-family: "Outfit", sans-serif; font-size: 18px; letter-spacing: .14em; color: #ff5a87; margin-bottom: 6px; }
    .photo { position: relative; margin: 40px 40px 40px 0; border-radius: 28px; overflow: hidden; }
    .photo .bg { width: 100%; height: 100%; object-fit: cover; }
    .mascot { position: absolute; right: 20px; bottom: 20px; width: 120px; border-radius: 50%; background: #fff; padding: 6px; }
</style>
</head>
<body>
    <div class="copy">
        <p class="badge">桜和高校同窓会</p>
        <h1>卒業生の力を、<br>在校生の探究の<br><span>アクセル</span>に。</h1>
        <p class="foot"><b>OWA ALUMNI ASSOCIATION</b>大阪府立桜和高等学校 同窓会 公式サイト</p>
    </div>
    <div class="photo">
        <img src="../images/桜和高校外見.webp" alt="" class="bg">
        <img src="../images/さくた.webp" alt="" class="mascot">
    </div>
</body>
</html>
